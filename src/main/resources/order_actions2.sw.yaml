---
id: order_actions2
version: '1.0'
specVersion: '0.8'
name: Order Workflow2
description: Order Workflow Sample2
start: Order Received
errors:
  - name: Unauthorized error
    code: '401'
    description: Unauthorized error received
functions:
  - name: printMessage
    type: custom
    operation: sysout
  - name: sendOrder2
    operation: specs/supplier.yaml#sendOrderV2
    type: rest
  - name: cancelOrder
    operation: specs/supplier.yaml#cancelOrder
    type: rest
states:
  - name: Order Received
    type: operation
    actions:
      - name: sendOrderRestCall
        functionRef:
          refName: sendOrder2
          arguments:
            supplier-id: .supplierId
            content: .orderId
        actionDataFilter:
          toStateData: .firstCall
      - name: printAction
        functionRef:
          refName: printMessage
          arguments:
            "message": "${.output}"
    onErrors:
      - errorRef: Unauthorized error
        transition: finish
    transition: finish
  - name: finish
    type: operation
    actions:
      - name: printAction
        functionRef:
          refName: printMessage
          arguments:
            "message": "Final State"
    end: true